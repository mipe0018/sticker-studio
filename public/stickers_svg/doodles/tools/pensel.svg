<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="1500" height="420">
<defs>
  <filter id="stickerShadow" x="-15%" y="-30%" width="140%" height="170%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
    <feOffset in="blur" dx="4" dy="8" result="offset"/>
    <feComponentTransfer in="offset" result="shadow">
      <feFuncA type="linear" slope="0.3"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="blue" x2="0" y2="1">
    <stop offset="0" stop-color="#8799b5"/>
    <stop offset=".5" stop-color="#9aaac2"/>
    <stop offset="1" stop-color="#7185a2"/>
  </linearGradient>
</defs>

