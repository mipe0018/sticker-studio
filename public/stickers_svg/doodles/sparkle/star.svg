
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<defs>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
    <feOffset in="blur" dx="3" dy="5" result="offset"/>
    <feComponentTransfer in="offset" result="shadow">
      <feFuncA type="linear" slope=".3"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="shadow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<g filter="url(#shadow)">
  <path d="M100 13 Q111 82 181 100 Q111 118 100 187 Q89 118 19 100 Q89 82 100 13Z"
    fill="#F6D77A" stroke="white" stroke-width="15" stroke-linejoin="round"/>
  <path d="M100 13 Q111 82 181 100 Q111 118 100 187 Q89 118 19 100 Q89 82 100 13Z"
    fill="#F6D77A" stroke="#564B3D" stroke-width="5" stroke-linejoin="round"/>
</g>
</svg>
