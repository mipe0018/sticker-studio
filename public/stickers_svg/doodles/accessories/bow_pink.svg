
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="4" dy="7" result="offset"/>
      <feComponentTransfer in="offset" result="shadow">
        <feFuncA type="linear" slope=".28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc5df"/>
      <stop offset=".5" stop-color="#ff91c4"/>
      <stop offset="1" stop-color="#ed5b9f"/>
    </linearGradient>

    <linearGradient id="darkPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffabd2"/>
      <stop offset="1" stop-color="#e94e96"/>
    </linearGradient>
  </defs>

  <!-- White sticker silhouette -->
  <g filter="url(#shadow)">
    <path d="
      M184 139
      C145 105 91 62 52 77
      C18 90 35 151 73 176
      L119 204
      L79 263
      Q72 277 88 279
      L154 266
      L190 202
      Q200 202 210 202
      L246 266
      L312 279
      Q328 277 321 263
      L281 204
      L327 176
      C365 151 382 90 348 77
      C309 62 255 105 216 139
      Z"
      fill="white" stroke="white" stroke-width="18"
      stroke-linejoin="round"/>
  </g>

  <!-- Left ribbon loop -->
  <path d="
    M190 151
    C151 118 91 65 55 83
    C27 98 49 147 83 168
    C115 189 151 189 190 176
    Z"
    fill="url(#pink)" stroke="#df5796" stroke-width="3"/>

  <!-- Right ribbon loop -->
  <path d="
    M210 151
    C249 118 309 65 345 83
    C373 98 351 147 317 168
    C285 189 249 189 210 176
    Z"
    fill="url(#pink)" stroke="#df5796" stroke-width="3"/>

  <!-- Ribbon folds -->
  <path d="M65 96 C105 106 139 141 169 165"
    fill="none" stroke="#fff0f7" stroke-width="8" stroke-linecap="round" opacity=".85"/>
  <path d="M335 96 C295 106 261 141 231 165"
    fill="none" stroke="#fff0f7" stroke-width="8" stroke-linecap="round" opacity=".85"/>

  <path d="M104 174 Q137 177 169 165"
    fill="none" stroke="#d94b91" stroke-width="4" opacity=".55"/>
  <path d="M296 174 Q263 177 231 165"
    fill="none" stroke="#d94b91" stroke-width="4" opacity=".55"/>

  <!-- Ribbon tails -->
  <path d="
    M177 171
    C164 196 137 231 91 267
    L151 253
    L190 190
    Z"
    fill="url(#darkPink)" stroke="#df5796" stroke-width="3" stroke-linejoin="round"/>

  <path d="
    M223 171
    C236 196 263 231 309 267
    L249 253
    L210 190
    Z"
    fill="url(#darkPink)" stroke="#df5796" stroke-width="3" stroke-linejoin="round"/>

  <!-- Tail highlights -->
  <path d="M163 204 Q143 235 112 252"
    fill="none" stroke="#ffcce4" stroke-width="6" stroke-linecap="round"/>
  <path d="M237 204 Q257 235 288 252"
    fill="none" stroke="#ffcce4" stroke-width="6" stroke-linecap="round"/>

  <!-- Center knot -->
  <path d="
    M174 151
    Q200 130 226 151
    Q237 174 218 192
    Q200 207 182 192
    Q163 174 174 151
    Z"
    fill="#f47db5" stroke="#df5796" stroke-width="3"/>

  <path d="M184 151 Q200 140 215 151"
    fill="none" stroke="#ffd9eb" stroke-width="6" stroke-linecap="round"/>

  <!-- Cute little details -->
  <path d="M75 118 Q83 111 91 119"
    fill="none" stroke="#fff5fa" stroke-width="5" stroke-linecap="round"/>
  <path d="M325 118 Q317 111 309 119"
    fill="none" stroke="#fff5fa" stroke-width="5" stroke-linecap="round"/>

  <circle cx="200" cy="177" r="3" fill="#ffeaf4"/>
  <path d="M60 190 l4 8 8 2 -8 4 -4 8 -3 -8 -8 -4 8 -2 Z" fill="#fff0f7"/>
  <path d="M340 190 l4 8 8 2 -8 4 -4 8 -3 -8 -8 -4 8 -2 Z" fill="#fff0f7"/>
</svg>
